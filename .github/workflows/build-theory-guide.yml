name: Build Theory Guide

on:
  push:
    paths:
      - 'docs/theory/**.tex'
      - 'docs/theory/**.bib'
      - '.github/workflows/build-theory-guide.yml'
  pull_request:
    paths:
      - 'docs/theory/**.tex'
      - 'docs/theory/**.bib'
      - '.github/workflows/build-theory-guide.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Opt into Node.js 24 to resolve deprecation errors for current actions
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    # Required for the softprops/action-gh-release to upload files
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile theory guide
        uses: xu-cheng/latex-action@v3
        with:
          root_file: solver_theory_guide.tex
          working_directory: docs/theory
          args: -pdf -bibtex -halt-on-error

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: theory-guide-pdf
          path: docs/theory/solver_theory_guide.pdf
          retention-days: 90

      - name: Upload PDF to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: docs/theory/solver_theory_guide.pdf